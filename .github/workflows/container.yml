# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). Quay.io only.
#
# ubi10-httpd-php is part of the ubi10 cascade: it cuts no release, so `cascade: true`
# moves :latest with :main, and it is rebuilt when its parent dispatches
# parent-image-updated.

name: Container

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.39.1
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/ubi10-httpd-php
      default-branch: master
      boot: systemd
      contract-test: tests/gate.sh
      cascade: true
      downstream: ubi10-httpd-php-mariadb ubi10-httpd-php-postgres spanish
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      CRUNCHTOOLS_CI_APP_KEY: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
