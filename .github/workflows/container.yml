# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). Quay.io only.
#
# ubi10-httpd-php is part of the ubi10 cascade: it cuts no release, so `cascade: true`
# moves :latest with :main, and it is rebuilt when its parent dispatches
# parent-image-updated.

name: Container

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/ubi10-httpd-php
      default-branch: master
      boot: systemd
      contract-test: tests/gate.sh
      cascade: true
      downstream: ubi10-httpd-php-mariadb ubi10-httpd-php-postgres spanish
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (default branch and v* only); without it promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      CRUNCHTOOLS_CI_APP_KEY: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
